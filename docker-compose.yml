services:
  db:
    image: postgres:16-alpine
    container_name: beadbuddy-db
    environment:
      POSTGRES_DB: beadbuddy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: beadbuddy-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: beadbuddy-backend
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/beadbuddy
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      JWT_SECRET_KEY: my-super-secret-key-for-jwt-tokens-12345
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      UPLOAD_DIR: uploads
      RESULTS_DIR: results
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    container_name: beadbuddy-worker
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/beadbuddy
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: celery -A tasks worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: beadbuddy-frontend
    depends_on:
      - backend
    ports:
      - "4173:4173"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
